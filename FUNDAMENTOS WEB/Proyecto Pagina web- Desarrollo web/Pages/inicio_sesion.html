<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div class="login-modal">

            <button
                class="modal-close"
                onclick="cerrarLogin()">
                ×
            </button>


            <div class="login-header">

                <div class="login-icon">
                    🎮
                </div>

                <h2>
                    Iniciar sesión
                </h2>

                <p>
                    Accede a tu cuenta de GameZone
                </p>

            </div>


            <form
                id="loginForm"
                onsubmit="iniciarSesion(event)">

                <div class="form-group">

                    <label for="loginUser">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="loginUser"
                        placeholder="Ingresa tu usuario"
                        required>

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Ingresa tu contraseña"
                        required>

                </div>


                <div
                    id="loginError"
                    class="login-error">
                </div>


                <button
                    type="submit"
                    class="btn-primary login-submit">

                    🔐 Ingresar

                </button>

            </form>


            <div class="demo-account">

                <strong>
                    Cuenta de prueba
                </strong>

                <p>
                    Usuario: <b>admin</b>
                </p>

                <p>
                    Contraseña: <b>1234</b>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
